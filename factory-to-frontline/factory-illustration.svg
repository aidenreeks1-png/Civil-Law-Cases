<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Industrial factory reconstruction</title>
<desc id="desc">Original educational illustration of a large early twentieth-century industrial factory with workers, heavy machinery, overhead cranes, steel beams and manufactured artillery components.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8d0bf"/><stop offset="1" stop-color="#a99d88"/></linearGradient>
  <pattern id="grain" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".8" fill="#282b29" opacity=".08"/><circle cx="11" cy="8" r=".7" fill="#fff" opacity=".12"/><circle cx="6" cy="14" r=".6" fill="#282b29" opacity=".07"/></pattern>
</defs>
<rect width="900" height="560" fill="url(#bg)"/><rect width="900" height="560" fill="url(#grain)"/>
<!-- factory roof and steel framing -->
<g fill="none" stroke="#424745" stroke-width="8" opacity=".9">
  <path d="M25 95 L160 28 L295 95 L430 28 L565 95 L700 28 L875 95"/>
  <path d="M30 95 H875"/>
  <path d="M70 95 V485 M230 95 V485 M390 95 V485 M550 95 V485 M710 95 V485 M850 95 V485"/>
</g>
<g fill="#eee8dc" stroke="#5b615e" stroke-width="3" opacity=".9">
  <rect x="83" y="112" width="125" height="76"/><rect x="245" y="112" width="125" height="76"/><rect x="405" y="112" width="125" height="76"/><rect x="565" y="112" width="125" height="76"/><rect x="725" y="112" width="105" height="76"/>
</g>
<!-- overhead crane -->
<g stroke="#343836" stroke-width="7" fill="none"><path d="M95 225 H808"/><path d="M125 208 V242 M778 208 V242"/><path d="M450 225 V292"/><path d="M435 289 Q450 320 465 289"/></g>
<!-- heavy machinery -->
<g fill="#555c59" stroke="#2e3230" stroke-width="4">
  <rect x="75" y="345" width="160" height="105" rx="8"/><circle cx="120" cy="395" r="31" fill="#8b8374"/><circle cx="120" cy="395" r="12" fill="#424745"/><rect x="155" y="365" width="60" height="58"/>
  <rect x="290" y="322" width="185" height="128" rx="8"/><circle cx="345" cy="378" r="38" fill="#8b8374"/><circle cx="345" cy="378" r="14" fill="#424745"/><rect x="400" y="345" width="55" height="80"/>
  <rect x="620" y="345" width="190" height="105" rx="8"/><circle cx="675" cy="395" r="30" fill="#8b8374"/><circle cx="675" cy="395" r="11" fill="#424745"/><rect x="720" y="365" width="70" height="58"/>
</g>
<!-- long manufactured components -->
<g fill="#343836" stroke="#202321" stroke-width="3">
  <rect x="205" y="280" width="400" height="32" rx="16"/><rect x="560" y="268" width="92" height="56" rx="8"/>
  <rect x="500" y="455" width="285" height="25" rx="12"/><circle cx="760" cy="467" r="24"/>
</g>
<!-- pipes -->
<g fill="none" stroke="#686f6b" stroke-width="14"><path d="M40 270 H145 V315"/><path d="M805 190 V300 H860"/></g>
<!-- workers -->
<g fill="#292d2b">
  <circle cx="255" cy="390" r="13"/><path d="M243 405 L267 405 L277 462 H235 Z"/><path d="M245 420 L213 447 M265 420 L292 445" stroke="#292d2b" stroke-width="10" stroke-linecap="round"/>
  <circle cx="535" cy="385" r="13"/><path d="M523 400 L547 400 L557 461 H515 Z"/><path d="M526 416 L493 442 M544 416 L573 440" stroke="#292d2b" stroke-width="10" stroke-linecap="round"/>
  <circle cx="835" cy="383" r="12"/><path d="M824 397 L846 397 L856 458 H814 Z"/>
</g>
<!-- floor lines -->
<g stroke="#70695c" stroke-width="3" opacity=".65"><path d="M0 490 H900"/><path d="M100 560 L360 485 M315 560 L470 485 M585 560 L595 485 M800 560 L720 485"/></g>
<rect x="24" y="22" width="245" height="46" fill="#252a29" opacity=".92"/><text x="42" y="52" fill="#f1eadc" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">INDUSTRIAL PRODUCTION</text>
<rect x="610" y="502" width="260" height="34" fill="#eee8dc" opacity=".88"/><text x="625" y="524" fill="#343836" font-family="Arial, sans-serif" font-size="15" font-weight="700">ORIGINAL EDUCATIONAL RECONSTRUCTION</text>
</svg>