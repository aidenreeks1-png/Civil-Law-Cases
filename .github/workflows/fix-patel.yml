name: Fix Patel game

on:
  push:
    paths:
      - '.github/workflows/fix-patel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch Patel game
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('patel-v-elevate.html')
          s=p.read_text()
          target="let i=0,score=0,selSide=null,selReason=null,notes=[],confHist=[50],verdict=null,analysis=0,reasoning=0,law=0,twisted=false,calcOK=false;"
          insert=target+"\nlet historySteps=[],reviewing=false,reviewIndex=-1,liveSnapshot=null,dutyScored=false,cp2Scored=false;"
          if 'let historySteps=[]' not in s:
              if target not in s:
                  raise SystemExit('Could not find Patel state line to patch')
              s=s.replace(target,insert,1)
          p.write_text(s)
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patel-v-elevate.html
          if git diff --cached --quiet; then
            echo "No patch needed"
          else
            git commit -m "Fix Patel game start and review state"
            git push
          fi
